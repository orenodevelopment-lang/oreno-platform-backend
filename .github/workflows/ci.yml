name: Backend production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oreno_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d oreno_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oreno_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oreno_test?schema=public
      KEY_VALUE_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-at-least-thirty-two-characters
      EMAIL_PROVIDER: capture
      STORAGE_DRIVER: local
      MALWARE_SCANNER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run migrate:deploy
      - run: npm run openapi:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
