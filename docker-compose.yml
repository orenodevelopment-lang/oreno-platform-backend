# Local development services for the Oreno backend.
# PostgreSQL and Key Value (Redis protocol) mirror the Render topology.
services:
  postgres:
    image: postgres:16-alpine
    container_name: oreno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oreno
      POSTGRES_PASSWORD: oreno
      POSTGRES_DB: oreno
      # Deterministic collation so index ordering matches production.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - oreno-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oreno -d oreno']
      interval: 5s
      timeout: 5s
      retries: 20

  key-value:
    image: redis:7-alpine
    container_name: oreno-key-value
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - oreno-key-value-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  oreno-postgres-data:
  oreno-key-value-data:
